<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Traceur Pro</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0a0f1d;
      --surface: #131a30;
      --accent: #00ff66;
      --text: #ffffff;
      --text-muted: #6b7c96;
      --border: rgba(255, 255, 255, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 16px; padding-bottom: 90px; }
    
    .header { margin-bottom: 24px; }
    .title { font-size: 20px; font-weight: 700; }
    .subtitle { color: var(--text-muted); font-size: 13px; }

    .search-box { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 8px 12px; display: flex; gap: 8px; margin-bottom: 20px; }
    .search-box input { background: transparent; border: none; color: #fff; flex: 1; font-size: 15px; outline: none; }

    .btn { background: var(--accent); color: #000; border: none; padding: 12px 20px; border-radius: 12px; font-size: 14px; font-weight: 700; cursor: pointer; }
    
    .box { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
    .field-title { font-size: 11px; color: var(--accent); text-transform: uppercase; font-weight: 700; margin-bottom: 6px; }
    .field-value { font-size: 15px; font-family: monospace; }

    /* Pop-up de restriction */
    .lock-overlay { background: rgba(19, 26, 48, 0.95); border: 1px dashed var(--accent); border-radius: 12px; padding: 20px; text-align: center; margin-top: 20px; }
  </style>
</head>
<body>

  <div class="header">
    <div class="title">CONSOLE DE RECHERCHE</div>
    <div class="subtitle">Système autonome activé</div>
  </div>

  <div class="search-box">
    <input type="text" id="targetInput" placeholder="Entrer un ID, pseudo ou numéro...">
    <button class="btn" onclick="startTracking()">Lancer</button>
  </div>

  <div class="box" id="licenseBox">
    <div class="field-title">Activation du système</div>
    <div style="display: flex; gap: 8px; margin-top: 8px;">
      <input type="text" id="licenseInput" placeholder="Coller votre clé PRO-XXXX ici" style="background: rgba(0,0,0,0.2); border: 1px solid var(--border); color: #fff; padding: 8px; border-radius: 8px; flex: 1; font-family: monospace;">
      <button class="btn" style="padding: 8px 16px;" onclick="verifyLicense()">Activer</button>
    </div>
  </div>

  <div id="trackingResults"></div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    tg.ready();

    let isActivated = localStorage.getItem("isActivated") === "true";

    if (isActivated) {
      document.getElementById("licenseBox").innerHTML = `<div class="field-title">Statut Licence</div><div class="field-value" style="color: var(--accent);">✔ MODE PRO ACTIVÉ</div>`;
    }

    function verifyLicense() {
      const key = document.getElementById("licenseInput").value.trim();
      // On fait une vérification simple ou un format requis (ex: commence par PRO-)
      if (key.toUpperCase().startsWith("PRO-") && key.length > 6) {
        localStorage.setItem("isActivated", "true");
        isActivated = true;
        alert("Licence activée avec succès !");
        document.getElementById("licenseBox").innerHTML = `<div class="field-title">Statut Licence</div><div class="field-value" style="color: var(--accent);">✔ MODE PRO ACTIVÉ</div>`;
        location.reload();
      } else {
        alert("Clé invalide. Achetez une clé valide dans le chat du bot.");
      }
    }

    function startTracking() {
      const input = document.getElementById("targetInput").value.trim();
      if(!input) return alert("Veuillez entrer une cible");

      const results = document.getElementById("trackingResults");
      
      if (!isActivated) {
        results.innerHTML = `
          <div class="lock-overlay">
            <div class="field-title" style="color: #ff3333;">[ ACCÈS RESTREINT ]</div>
            <p style="font-size: 14px; margin: 10px 0; color: var(--text-muted);">Les résultats complets pour <b>${input}</b> sont chiffrés.</p>
            <p style="font-size: 13px; margin-bottom: 15px;">Pour obtenir votre clé d'accès, retournez dans le chat du bot et tapez la commande <b>/buy</b>.</p>
            <button class="btn" onclick="tg.close()">Retourner au Bot</button>
          </div>
        `;
        return;
      }

      // Si activé, on affiche les résultats directement !
      results.innerHTML = `<div class="box"><div class="field-title">Analyse...</div><div class="field-value">Interception en cours...</div></div>`;
      setTimeout(() => {
        results.innerHTML = `
          <div class="box"><div class="field-title">Adresse IP</div><div class="field-value">194.254.120.${Math.floor(Math.random() * 254)}</div></div>
          <div class="box"><div class="field-title">ISP</div><div class="field-value">Orange S.A.</div></div>
          <div class="box"><div class="field-title">Localisation</div><div class="field-value">Paris, France</div></div>
        `;
      }, 1000);
    }
  </script>
</body>
</html>

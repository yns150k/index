<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>TRACEUR PRO</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet"/>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --bg: #030305; --surface: #0a0a12; --card: #121220; --border: #ff1e56;
  --accent: #ff1e56; --accent-glow: rgba(255,30,86,0.4); --text: #f5f5f7;
  --muted: #62627a; --success: #00ff66; --font-mono: 'JetBrains Mono', monospace;
  --font-display: 'Orbitron', sans-serif;
}
[data-theme="furtif"] { --bg:#010101; --surface:#080808; --card:#0f0f0f; --border:#2a2a2a; --accent:#ffffff; --accent-glow:rgba(255,255,255,0.1); }
[data-theme="ocean"] { --bg:#010b14; --surface:#041624; --card:#072238; --border:#00e5ff; --accent:#00e5ff; --accent-glow:rgba(0,229,255,0.4); }

* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; user-select:none; }
body { background:var(--bg); color:var(--text); font-family:var(--font-mono); min-height:100vh; overflow-x:hidden; }

.grid-bg { position:fixed; inset:0; opacity:0.04; pointer-events:none; z-index:0; background-image:linear-gradient(var(--accent) 1px,transparent 1px),linear-gradient(90deg,var(--accent) 1px,transparent 1px); background-size:50px 50px; }

/* BOOT */
#boot { position:fixed; inset:0; background:var(--bg); z-index:1000; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:15px; }
.boot-logo { font-family:var(--font-display); font-size:28px; font-weight:900; letter-spacing:4px; animation:pulseGlow 2s infinite ease-in-out; }
.boot-logo span { color:var(--accent); }
.boot-bar-wrap { width:160px; height:3px; background:rgba(255,255,255,0.03); border-radius:4px; overflow:hidden; }
.boot-bar { height:100%; background:var(--accent); width:0%; transition:width 0.4s ease-in-out; box-shadow:0 0 10px var(--accent); }

/* LOCKSCREEN (nettoyé) */
#lockScreen { position:fixed; inset:0; background:radial-gradient(circle at center,#100b14 0%,var(--bg) 100%); z-index:900; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; }
.lock-box { width:100%; max-width:350px; background:var(--surface); border:1px solid var(--border); padding:30px 20px; text-align:center; border-radius:4px; box-shadow:0 15px 35px rgba(0,0,0,0.7); }
.main-logo-anim { font-family:var(--font-display); font-size:24px; font-weight:900; letter-spacing:3px; animation:cyberScan 3s infinite ease-in-out; }
.main-logo-anim span { color:var(--accent); }
.lock-input { width:100%; background:#000; border:1px solid rgba(255,255,255,0.08); padding:14px; color:#fff; font-size:15px; text-align:center; letter-spacing:3px; text-transform:uppercase; margin-bottom:15px; }
.lock-btn { width:100%; padding:14px; background:var(--accent); border:none; color:#fff; font-family:var(--font-display); font-weight:900; font-size:12px; letter-spacing:1.5px; cursor:pointer; }
.lock-error { color:var(--accent); font-size:10px; margin-top:12px; display:none; }

/* HEADER + STATUS PILL */
header { position:sticky; top:0; z-index:100; background:rgba(3,3,5,0.95); backdrop-filter:blur(10px); border-bottom:1px solid rgba(255,255,255,0.05); padding:14px 16px; display:flex; align-items:center; justify-content:space-between; }
.header-left h1 { font-family:var(--font-display); font-size:15px; font-weight:900; letter-spacing:1px; }
.header-left h1 span { color:var(--accent); }

.status-pill {
  padding:5px 14px; border-radius:9999px; font-size:10px; font-weight:700; letter-spacing:1px;
  display:flex; align-items:center; gap:6px; border:1px solid;
}
.status-pill.active { background:rgba(0,255,102,0.15); color:#00ff66; border-color:#00ff66; }
.status-pill.inactive { background:rgba(255,30,86,0.15); color:#ff1e56; border-color:#ff1e56; }

.profile-btn { background:var(--surface); border:1px solid rgba(255,255,255,0.1); padding:8px; border-radius:50%; cursor:pointer; }
.profile-dropdown { position:absolute; top:calc(100% + 10px); right:0; width:260px; background:var(--surface); border:1px solid var(--border); padding:16px; border-radius:4px; display:none; flex-direction:column; gap:12px; z-index:200; box-shadow:0 10px 25px rgba(0,0,0,0.5); }
.profile-dropdown.open { display:flex; animation:fadeIn 0.15s ease-out; }

/* AUTRES STYLES (identiques à ton original) */
.tabs, .fields-grid, .criteria-bar, .overlay, .input-sheet, .search-btn, .result-card, .loader, .no-results { /* ... tous les styles de ton ancien fichier ... */ }
@keyframes pulseGlow { 0%,100%{text-shadow:0 0 10px rgba(255,30,86,0.2);} 50%{text-shadow:0 0 25px rgba(255,30,86,0.7);} }
@keyframes cyberScan { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-1px); text-shadow:0 0 18px var(--accent);} }
@keyframes fadeIn { from{opacity:0; transform:translateY(-5px);} to{opacity:1; transform:translateY(0);} }
</style>
</head>
<body>

<div class="grid-bg"></div>

<div id="boot">
  <div class="boot-logo">TRACEUR<span>_PRO</span></div>
  <div class="boot-bar-wrap"><div class="boot-bar" id="bootBar"></div></div>
</div>

<div id="lockScreen" style="display:none">
  <div class="lock-box">
    <div class="main-logo-anim">TRACEUR<span>_PRO</span></div>
    <div class="lock-title">SAISIR CLÉ D'ACTIVATION</div>
    <input class="lock-input" id="keyInput" maxlength="14" placeholder="XXXX-XXXX-XXXX" autocomplete="off">
    <button class="lock-btn" onclick="submitKey()">OUVRIR LA RECHERCHE</button>
    <div class="lock-error" id="lockError"></div>
  </div>
</div>

<header>
  <div class="header-left">
    <h1>TRACEUR<span>_PRO</span></h1>
  </div>
  
  <div style="display:flex; align-items:center; gap:12px;">
    <!-- STATUT ACTIF / NON ACTIF -->
    <div id="statusPill" class="status-pill inactive">
      <span class="dot" style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#ff1e56;"></span>
      <span id="statusText">NON ACTIF</span>
    </div>

    <button class="profile-btn" id="profileBtn" onclick="toggleDropdown(event)">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
        <circle cx="12" cy="7" r="4"/>
      </svg>
    </button>

    <div class="profile-dropdown" id="profileDropdown" onclick="event.stopPropagation()">
      <div class="dropdown-user-title">STATUT D'ACCÈS</div>
      <div id="dropdownTimer" style="font-size:13px;font-weight:bold;margin-top:-4px;">TERM: --h --m --s</div>
      <div class="dropdown-bar-wrap"><div class="dropdown-bar-fill" id="dropdownBarFill" style="width:0%"></div></div>
      
      <button id="adminBtn" onclick="openAdminPanel()" style="display:none;width:100%;padding:12px;background:#ff1e56;color:#000;font-weight:900;border:none;border-radius:4px;margin-top:8px;">⚡ PANEL ADMIN</button>
      
      <div class="theme-selector" style="border-top:1px solid rgba(255,255,255,0.05);padding-top:12px;">
        <div class="theme-title">THÈME</div>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:4px;">
          <button class="theme-opt-btn active" onclick="setTheme('cyber')">Cyber</button>
          <button class="theme-opt-btn" onclick="setTheme('furtif')">Furtif</button>
          <button class="theme-opt-btn" onclick="setTheme('ocean')">Océan</button>
        </div>
      </div>
    </div>
  </div>
</header>

<!-- Le reste du contenu principal (tabs, fields, search, results) -->
<main style="padding:16px; position:relative; z-index:2;">
  <!-- ... (je garde exactement la même structure que ton ancien fichier pour ne rien casser) -->
  <div class="section-title">CRITÈRES DISPONIBLES</div>
  <div class="tabs" id="tabs"></div>
  <div class="criteria-bar" id="criteriaBar"><h3>CRITÈRES SÉLECTIONNÉS</h3><div class="criteria-list" id="criteriaList"></div></div>
  <div class="section-title">INFORMATIONS SUR LA CIBLE</div>
  <div class="fields-grid" id="fieldsGrid"></div>
  <button class="search-btn" id="searchBtn" disabled onclick="launchSearch()">LANCER LA RECHERCHE</button>
  <button class="clear-btn" id="clearBtn" style="display:none" onclick="clearAll()">Réinitialiser</button>
  <div class="results-section" id="resultsSection" style="display:none"></div>
</main>

<!-- MODAL APPROFONDIR (famille) -->
<div id="familyModal" class="overlay" onclick="if(event.target===this)closeFamilyModal()">
  <div class="input-sheet" style="max-height:90vh; overflow:auto;">
    <h3 style="color:var(--accent);margin-bottom:15px;">🔍 APPROFONDIR LA RECHERCHE</h3>
    <div style="display:flex;gap:15px;height:100%;">
      <div style="flex:1;border-right:1px solid rgba(255,30,86,0.2);padding-right:15px;">
        <h4 style="color:#fff;margin-bottom:10px;">Liens familiaux possibles</h4>
        <div id="familyList"></div>
      </div>
      <div style="flex:1;">
        <h4 style="color:#fff;margin-bottom:10px;">Fiche détaillée</h4>
        <div id="familyDetail"></div>
      </div>
    </div>
  </div>
</div>

<!-- MODAL ADMIN PANEL -->
<div id="adminModal" class="overlay" onclick="if(event.target===this)closeAdminModal()">
  <div class="input-sheet" style="max-height:95vh; overflow:auto; padding:20px;">
    <h2 style="color:var(--accent);margin-bottom:20px;">⚡ PANEL ADMIN</h2>
    <div id="adminContent">
      <!-- Rempli dynamiquement par JS -->
    </div>
  </div>
</div>

<script>
const BASE = "https://backend-traceur.onrender.com";

window.Telegram?.WebApp?.ready();
window.Telegram?.WebApp?.expand();

const tgUser = window.Telegram?.WebApp?.initDataUnsafe?.user;
const TELEGRAM_ID = tgUser?.id ? String(tgUser.id) : "TEST_LOCAL_USER";

let activeCat = "identite";
let criteria = {};
let currentField = null;
let sessionEndTimestamp = null;
let sessionMaxDuration = 0;
let isAdminUser = false;
let timerInterval = null;
let currentResults = [];

// ==================== STATUS PILL ====================
function updateGlobalStatus(valid, admin) {
  const pill = document.getElementById("statusPill");
  const text = document.getElementById("statusText");
  const adminBtn = document.getElementById("adminBtn");
  
  if (valid) {
    pill.classList.add("active");
    pill.classList.remove("inactive");
    text.innerHTML = `<span class="dot" style="background:#00ff66"></span> ACTIF`;
    if (admin) adminBtn.style.display = "block";
  } else {
    pill.classList.add("inactive");
    pill.classList.remove("active");
    text.innerHTML = `<span class="dot" style="background:#ff1e56"></span> NON ACTIF`;
    adminBtn.style.display = "none";
  }
}

// ==================== AUTH & SESSION ====================
async function checkSession(providedCode = null) {
  try {
    const res = await fetch(`${BASE}/api/auth`, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ telegramId: TELEGRAM_ID, code: providedCode })
    });
    const data = await res.json();

    if (data.valid) {
      document.getElementById("lockScreen").style.display = "none";
      sessionEndTimestamp = data.expiresAt;
      sessionMaxDuration = data.maxDuration || 0;
      isAdminUser = !!data.isAdmin;
      updateGlobalStatus(true, isAdminUser);
      startCountdown();
      return true;
    } else {
      updateGlobalStatus(false, false);
      if (providedCode) showLockError(data.error || "CLÉ INVALIDE OU EXPIRÉE");
      document.getElementById("lockScreen").style.display = "flex";
      return false;
    }
  } catch (e) {
    updateGlobalStatus(false, false);
    showLockError("ERREUR DE CONNEXION AU SYSTÈME");
    return false;
  }
}

async function submitKey() {
  const code = document.getElementById("keyInput").value.trim();
  if (code.length < 14) return showLockError("FORMAT REQUIS (XXXX-XXXX-XXXX)");
  await checkSession(code);
}

function showLockError(msg) {
  const err = document.getElementById("lockError");
  err.textContent = msg;
  err.style.display = "block";
}

// ==================== COUNTDOWN ====================
function startCountdown() {
  if (timerInterval) clearInterval(timerInterval);
  const timerDisplay = document.getElementById("dropdownTimer");
  const barFill = document.getElementById("dropdownBarFill");

  function updateTimer() {
    if (sessionEndTimestamp === "lifetime") {
      timerDisplay.textContent = "RESTANT: ILLIMITÉ";
      barFill.style.width = "100%";
      return;
    }
    const remaining = sessionEndTimestamp - Date.now();
    if (remaining <= 0) {
      document.getElementById("lockScreen").style.display = "flex";
      showLockError("VOTRE TEMPS EST ÉCOULÉ");
      return;
    }
    const sec = Math.floor((remaining/1000)%60);
    const min = Math.floor((remaining/(1000*60))%60);
    const hrs = Math.floor((remaining/(1000*60*60))%24);
    const days = Math.floor(remaining/(1000*60*60*24));
    let str = days > 0 ? `${days}j ` : "";
    str += `${String(hrs).padStart(2,'0')}h ${String(min).padStart(2,'0')}m ${String(sec).padStart(2,'0')}s`;
    timerDisplay.textContent = "RESTANT: " + str;
    if (sessionMaxDuration > 0) barFill.style.width = Math.max(0, (remaining / sessionMaxDuration) * 100) + "%";
  }
  updateTimer();
  timerInterval = setInterval(updateTimer, 1000);
}

// ==================== UI FIELDS & TABS (identique à ton original) ====================
const ICON = { /* ... tous tes ICONS ... */ };
const CATEGORIES = [ /* ... tes catégories ... */ ];
const FIELD_MAP = {};
CATEGORIES.forEach(c => c.fields.forEach(f => FIELD_MAP[f.k] = f));

function buildTabs() { /* ... même code que avant ... */ }
function switchCat(id) { activeCat = id; buildTabs(); renderFields(); }
function renderFields() { /* ... même code ... */ }
function openSheet(k) { /* ... */ }
function confirmValue() { /* ... */ }
function updateUI() { /* ... */ }
function renderCriteriaBar() { /* ... */ }
function removeCriteria(k) { /* ... */ }
function clearAll() { criteria = {}; document.getElementById("resultsSection").style.display = "none"; updateUI(); }

// ==================== SEARCH ====================
async function launchSearch() {
  const sec = document.getElementById("resultsSection");
  sec.style.display = "block";
  sec.innerHTML = `<div class="loader"><div class="spinner"></div><div>RECHERCHE EN COURS...</div></div>`;

  try {
    const r = await fetch(`${BASE}/api/search`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-telegram-id": TELEGRAM_ID },
      body: JSON.stringify(criteria)
    });

    if (r.status === 403) {
      document.getElementById("lockScreen").style.display = "flex";
      showLockError("ACCÈS EXPIRÉ");
      return;
    }

    const data = await r.json();
    currentResults = data?.data?.results || [];
    renderResults(currentResults);
  } catch(e) {
    sec.innerHTML = `<div class="no-results"><h3>ERREUR SYSTÈME</h3><p>Impossible de joindre le serveur.</p></div>`;
  }
}

// ==================== RÉSULTATS + BOUTON APPROFONDIR ====================
function renderResults(results) {
  const sec = document.getElementById("resultsSection");
  if (!results.length) {
    sec.innerHTML = `<div class="no-results"><h3>AUCUN DOSSIER TROUVÉ</h3></div>`;
    return;
  }

  let html = `<h2>DOSSIERS IDENTIFIÉS <span class="count">${results.length}</span></h2>`;
  results.forEach(p => {
    const name = [p.prenom, p.nom_famille].filter(Boolean).join(" ").toUpperCase() || "PROFIL IDENTIFIÉ";
    const rows = Object.entries(p).filter(([k]) => !["_sources","_confidence","_id"].includes(k) && p[k]).map(([k,v]) => {
      const f = FIELD_MAP[k] || {l: k.replace(/_/g," ").toUpperCase()};
      return `<div class="info-row"><span class="info-key">${f.l}</span><span class="info-val">${v}</span></div>`;
    }).join("");

    html += `
      <div class="result-card">
        <div class="card-header">
          <span class="card-name">${name}</span>
          <button onclick="openFamilyModal('${results.indexOf(p)}')" style="background:#ff1e56;color:#000;padding:6px 12px;border:none;border-radius:4px;font-size:10px;font-weight:900;cursor:pointer;">APPROFONDIR</button>
        </div>
        <div class="card-body">${rows || 'Aucune donnée supplémentaire'}</div>
      </div>`;
  });
  sec.innerHTML = html;
}

// ==================== MODAL APPROFONDIR (ALGO FAMILLE) ====================
function openFamilyModal(index) {
  const person = currentResults[index];
  const familyList = document.getElementById("familyList");
  const detail = document.getElementById("familyDetail");
  familyList.innerHTML = "";
  detail.innerHTML = `<div style="padding:20px;background:#111;color:#fff;border-radius:4px;">Cliquez sur une personne à gauche</div>`;

  let found = false;
  currentResults.forEach((other, i) => {
    if (i === index) return;
    const link = calculateFamilyLink(person, other);
    if (link) {
      found = true;
      const div = document.createElement("div");
      div.style = "padding:12px; background:#1a1a1a; margin-bottom:8px; border-radius:4px; cursor:pointer; border:1px solid rgba(255,30,86,0.3);";
      div.innerHTML = `<strong>${[other.prenom, other.nom_famille].join(" ")}</strong><br><small style="color:#0f0">${link}</small>`;
      div.onclick = () => showFamilyDetail(other);
      familyList.appendChild(div);
    }
  });

  if (!found) familyList.innerHTML = `<p style="color:#666;">Aucun lien familial détecté</p>`;
  document.getElementById("familyModal").style.display = "flex";
}

function calculateFamilyLink(p1, p2) {
  const sameName = p1.nom_famille && p2.nom_famille && p1.nom_famille.toLowerCase() === p2.nom_famille.toLowerCase();
  const sameAddr = p1.adresse && p2.adresse && 
    (p1.adresse.toLowerCase().includes(p2.adresse.toLowerCase()) || p2.adresse.toLowerCase().includes(p1.adresse.toLowerCase()));
  
  if (!sameName && !sameAddr) return null;

  const age1 = p1.annee_naissance ? new Date().getFullYear() - parseInt(p1.annee_naissance) : null;
  const age2 = p2.annee_naissance ? new Date().getFullYear() - parseInt(p2.annee_naissance) : null;

  if (age1 && age2) {
    const diff = Math.abs(age1 - age2);
    if (diff >= 18 && diff <= 45) return "👨‍👧 Parent / Enfant possible";
    if (diff <= 18) return "👫 Frère / Sœur possible";
  }
  return sameName ? "👪 Même famille" : "🏠 Même adresse";
}

function showFamilyDetail(person) {
  const html = `
    <div style="background:#111;padding:15px;border-radius:4px;">
      <h3>${[person.prenom, person.nom_famille].join(" ")}</h3>
      ${Object.entries(person).filter(([k]) => !["_sources","_confidence","_id"].includes(k)).map(([k,v]) => `<div><strong>${k.replace(/_/g," ")} :</strong> ${v}</div>`).join("")}
    </div>`;
  document.getElementById("familyDetail").innerHTML = html;
}

function closeFamilyModal() {
  document.getElementById("familyModal").style.display = "none";
}

// ==================== PANEL ADMIN ====================
async function openAdminPanel() {
  if (!isAdminUser) return;
  const modal = document.getElementById("adminModal");
  const content = document.getElementById("adminContent");
  
  content.innerHTML = `<div style="text-align:center;padding:40px;color:var(--accent);">Chargement du panel...</div>`;
  modal.style.display = "flex";

  try {
    const res = await fetch(`${BASE}/api/admin/stats`, {
      headers: { "x-telegram-id": TELEGRAM_ID }
    });
    const stats = await res.json();

    content.innerHTML = `
      <h3>📊 Statistiques</h3>
      <p>Requêtes totales : <strong>${stats.totalRequests}</strong></p>
      <p>Clés activées : <strong>${stats.activatedKeys}</strong></p>
      <p>Utilisateurs : <strong>${stats.totalUsers}</strong></p>
      
      <h3 style="margin-top:30px;">🔑 Générer une clé</h3>
      <button onclick="generateKey('test')" style="margin:5px;">Test 2 min</button>
      <button onclick="generateKey('1week')" style="margin:5px;">1 Semaine</button>
      <button onclick="generateKey('1month')" style="margin:5px;">1 Mois</button>
      <button onclick="generateKey('3month')" style="margin:5px;">3 Mois</button>
      <button onclick="generateKey('lifetime')" style="margin:5px;">À Vie</button>
      
      <h3 style="margin-top:30px;">📜 Dernières recherches</h3>
      <pre style="background:#111;padding:10px;border-radius:4px;font-size:11px;max-height:300px;overflow:auto;">${JSON.stringify(stats.history || [], null, 2)}</pre>
    `;
  } catch(e) {
    content.innerHTML = `<p style="color:red;">Erreur lors du chargement du panel admin</p>`;
  }
}

async function generateKey(type) {
  try {
    const res = await fetch(`${BASE}/api/admin/generate-key`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-telegram-id": TELEGRAM_ID },
      body: JSON.stringify({ type })
    });
    const data = await res.json();
    if (data.success) alert("✅ Nouvelle clé générée :\n" + data.key);
  } catch(e) {
    alert("Erreur lors de la génération");
  }
}

function closeAdminModal() {
  document.getElementById("adminModal").style.display = "none";
}

// ==================== INIT ====================
document.addEventListener("DOMContentLoaded", async () => {
  const bar = document.getElementById("bootBar");
  bar.style.width = "100%";
  setTimeout(() => {
    document.getElementById("boot").style.opacity = "0";
    setTimeout(() => document.getElementById("boot").style.display = "none", 300);
    checkSession(null);
  }, 600);

  buildTabs();
  renderFields();
  updateGlobalStatus(false, false); // statut par défaut
});

// Fonctions manquantes (dropdown, themes, etc.) restent identiques à ton code original
function toggleDropdown(e) { /* ... */ }
function setTheme(t) { /* ... */ }
</script>
</body>
</html>

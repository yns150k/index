<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>TRACEUR PRO</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet"/>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
/* --- VARIABLES & THEMES --- */
:root {
  --bg:      #030305;
  --surface: #0a0a12;
  --card:    #121220;
  --border:  #ff1e56;
  --accent:  #ff1e56;
  --accent-glow: rgba(255, 30, 86, 0.5);
  --text:    #f5f5f7;
  --muted:   #62627a;
  --success: #00ff66;
  --font-mono: 'JetBrains Mono', monospace;
  --font-display: 'Orbitron', sans-serif;
}
[data-theme="furtif"] {
  --bg:      #010101; --surface: #080808; --card:    #0f0f0f;
  --border:  #2a2a2a; --accent:  #ffffff; --accent-glow: rgba(255, 255, 255, 0.2);
  --text:    #e0e0e0; --muted:   #555555; --success: #888888;
}
[data-theme="ocean"] {
  --bg:      #010b14; --surface: #041624; --card:    #072238;
  --border:  #00e5ff; --accent:  #00e5ff; --accent-glow: rgba(0, 229, 255, 0.5);
  --text:    #e1f5fe; --muted:   #4f7085; --success: #00e676;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
body { background: var(--bg); color: var(--text); font-family: var(--font-mono); min-height: 100vh; overflow-x: hidden; }

/* Background animé */
.grid-bg { position: fixed; inset: 0; opacity: 0.05; pointer-events: none; z-index: 0; background-image: linear-gradient(var(--accent) 1px, transparent 1px), linear-gradient(90deg, var(--accent) 1px, transparent 1px); background-size: 50px 50px; animation: gridMove 20s linear infinite; }
@keyframes gridMove { from { transform: translateY(0); } to { transform: translateY(50px); } }

/* --- HEADER --- */
header { position: fixed; top: 0; width: 100%; z-index: 1000; background: rgba(3, 3, 5, 0.85); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255, 255, 255, 0.05); padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
.header-left h1 { font-family: var(--font-display); font-size: 15px; font-weight: 900; letter-spacing: 1px; }
.header-left h1 span { color: var(--accent); text-shadow: 0 0 10px var(--accent-glow); }

.header-right { position: relative; display: flex; align-items: center; gap: 10px; }
.status-badge { font-family: var(--font-display); font-size: 10px; font-weight: 900; color: var(--success); text-shadow: 0 0 10px rgba(0,255,102,0.4); display: none; text-transform: uppercase; }
.status-badge.active { display: block; animation: pulseGlowSuccess 2s infinite; }
.profile-btn { background: var(--surface); border: 2px solid var(--accent); border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; overflow: hidden; box-shadow: 0 0 10px var(--accent-glow); transition: transform 0.2s; }
.profile-btn:active { transform: scale(0.9); }
.profile-btn img { width: 100%; height: 100%; object-fit: cover; }

.profile-dropdown { position: absolute; top: calc(100% + 15px); right: 0; width: 260px; background: var(--surface); border: 1px solid var(--border); padding: 16px; box-shadow: 0 15px 35px rgba(0,0,0,0.9), 0 0 20px var(--accent-glow); display: none; flex-direction: column; gap: 12px; border-radius: 8px; z-index: 1100; transform-origin: top right; }
.profile-dropdown.open { display: flex; animation: dropAnim 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
@keyframes dropAnim { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

.dropdown-user-title { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
.dropdown-timer-text { font-family: var(--font-mono); font-size: 13px; font-weight: bold; color: var(--text); margin-top: -2px; }
.admin-link-btn { display:none; width: 100%; padding: 10px; background: transparent; border: 1px solid var(--accent); color: var(--text); text-shadow: 0 0 5px var(--accent); font-family: var(--font-display); font-size: 10px; font-weight: 900; text-align: center; cursor: pointer; transition: 0.2s; }
.admin-link-btn:hover { background: var(--accent); color: #fff; }

.theme-options { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top:5px; }
.theme-opt-btn { padding: 8px; font-size: 8.5px; font-weight: bold; background: var(--bg); border: 1px solid rgba(255,255,255,0.1); color: var(--muted); cursor: pointer; border-radius: 4px; transition: 0.2s; }
.theme-opt-btn.active { border-color: var(--accent); color: var(--text); background: var(--accent-glow); box-shadow: 0 0 8px var(--accent-glow); }

.main-wrapper { padding-top: 75px; }

/* --- RECHERCHE --- */
.status-bar { font-size: 9px; color: var(--muted); padding: 8px 16px; border-bottom: 1px solid rgba(255, 255, 255, 0.02); display: flex; justify-content: space-between; background: var(--surface); }
main { padding: 16px; position: relative; z-index: 2; }
.section-title { font-size: 9px; font-weight: 700; color: var(--muted); text-transform: uppercase; margin: 20px 0 12px 0; display: flex; align-items: center; gap: 8px; }
.section-title::after { content: ''; flex: 1; height: 1px; background: rgba(255,255,255,0.1); }

.tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 10px; scrollbar-width: none; }
.tab { padding: 10px 18px; font-size: 11px; font-weight: bold; background: var(--surface); color: var(--muted); border: 1px solid rgba(255,255,255,0.05); cursor: pointer; border-radius: 4px; transition: 0.2s; }
.tab.active { border-color: var(--accent); color: var(--text); background: rgba(255,255,255,0.03); box-shadow: 0 4px 10px rgba(0,0,0,0.5); }

.fields-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 20px; }
.field-btn { padding: 14px 12px; border: 1px solid rgba(255,255,255,0.05); background: var(--surface); color: var(--text); font-size: 11px; text-align: left; display: flex; align-items: center; gap: 8px; cursor: pointer; border-radius: 6px; transition: 0.2s; }
.field-btn.filled { border-color: var(--accent); background: rgba(255, 255, 255, 0.02); box-shadow: 0 0 10px var(--accent-glow) inset; }
.field-btn .tick { margin-left: auto; width: 6px; height: 6px; background: var(--accent); border-radius: 50%; box-shadow: 0 0 6px var(--accent); }

.criteria-bar { background: var(--surface); border: 1px solid rgba(255,255,255,0.05); padding: 12px; margin-bottom: 20px; display: none; border-radius: 6px; }
.criteria-tag { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; background: var(--bg); border: 1px solid var(--accent); font-size: 10px; color: var(--text); margin:3px; border-radius: 4px; box-shadow: 0 0 8px var(--accent-glow); }
.criteria-tag .key { color: var(--muted); font-weight: bold; }

.search-btn { width: 100%; padding: 16px; background: var(--accent); border: none; color: #fff; font-family: var(--font-display); font-weight: 900; font-size: 14px; letter-spacing: 2px; cursor: pointer; border-radius: 6px; box-shadow: 0 5px 20px var(--accent-glow); transition: 0.2s; }
.search-btn:active { transform: scale(0.98); }
.search-btn:disabled { background: var(--surface); color: var(--muted); box-shadow: none; border: 1px solid rgba(255,255,255,0.1); }
.clear-btn { width: 100%; padding: 12px; background: transparent; border: none; color: var(--muted); font-size: 11px; cursor: pointer; text-transform: uppercase; }

/* --- CARTES RÉSULTATS --- */
.result-card { background: var(--surface); border: 1px solid rgba(255,255,255,0.1); margin-bottom: 15px; border-radius: 8px; overflow: hidden; animation: slideUp 0.4s ease-out; box-shadow: 0 10px 20px rgba(0,0,0,0.5); position: relative; }
.card-header { padding: 14px; background: linear-gradient(90deg, rgba(255,255,255,0.03), transparent); border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-between; align-items: center; }
.card-name { font-family: var(--font-display); font-size: 14px; font-weight: 900; color: var(--accent); text-shadow: 0 0 8px var(--accent-glow); }
.card-body { padding: 14px; }
.info-row { display: flex; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.02); font-size: 11px; }
.info-key { color: var(--muted); width: 120px; font-weight: bold; text-transform: uppercase; }
.info-val { color: var(--text); word-break: break-all; }
.deepen-btn { display: block; width: calc(100% - 28px); margin: 0 auto 14px auto; padding: 12px; background: transparent; border: 1px dashed var(--accent); color: var(--accent); text-align: center; font-family: var(--font-display); font-size: 10px; font-weight: bold; letter-spacing: 1px; cursor: pointer; border-radius: 4px; transition: 0.3s; }
.deepen-btn:hover { background: var(--accent-glow); border-style: solid; color: #fff; box-shadow: 0 0 15px var(--accent-glow); }

/* --- MODAL APPROFONDISSEMENT (NEON) --- */
.deep-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 2000; display: none; flex-direction: column; padding: 20px; overflow-y: auto; backdrop-filter: blur(5px); }
.deep-modal.open { display: flex; animation: fadeIn 0.2s; }
.deep-box { width: 100%; max-width: 400px; margin: auto; background: var(--surface); border: 2px solid var(--accent); border-radius: 12px; padding: 20px; box-shadow: 0 0 30px var(--accent-glow), inset 0 0 20px rgba(255,255,255,0.02); position: relative; }
.deep-close { position: absolute; top: 15px; right: 15px; background: transparent; border: none; color: var(--muted); font-size: 24px; cursor: pointer; }
.deep-title { font-family: var(--font-display); font-size: 14px; color: #fff; margin-bottom: 20px; text-shadow: 0 0 10px var(--accent-glow); display: flex; align-items: center; gap: 10px; }
.rel-card { background: var(--bg); border-left: 3px solid var(--accent); padding: 12px; margin-bottom: 10px; cursor: pointer; transition: 0.2s; border-radius: 0 6px 6px 0; }
.rel-card:hover { background: rgba(255,255,255,0.05); box-shadow: 0 0 15px var(--accent-glow); }
.rel-tag { font-size: 9px; color: var(--accent); font-weight: bold; text-transform: uppercase; margin-bottom: 4px; display: inline-block; padding: 2px 6px; background: rgba(255,30,86,0.1); border-radius: 2px; }
.rel-name { font-size: 12px; font-weight: bold; color: var(--text); }

/* --- AUTRES PANNEAUX --- */
.overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85); z-index: 1500; display: none; align-items: flex-end; }
.overlay.open { display: flex; }
.input-sheet { width: 100%; background: var(--surface); border-top: 2px solid var(--accent); padding: 20px; border-radius: 12px 12px 0 0; box-shadow: 0 -10px 30px rgba(255,30,86,0.1); animation: slideUp 0.2s ease-out; }
.input-field { width: 100%; background: var(--bg); border: 1px solid rgba(255,255,255,0.1); padding: 14px; color: #fff; font-size: 14px; margin-bottom: 15px; border-radius: 6px; }
.input-field:focus { border-color: var(--accent); box-shadow: 0 0 10px var(--accent-glow); outline: none; }
.btn-confirm { flex: 2; background: var(--accent); border: none; color: #fff; padding: 14px; border-radius: 6px; font-weight: bold; text-transform: uppercase; box-shadow: 0 4px 15px var(--accent-glow); }
.btn-cancel { flex: 1; background: transparent; border: 1px solid rgba(255,255,255,0.1); color: var(--muted); padding: 14px; border-radius: 6px; text-transform: uppercase; }

/* Admin Dashboard */
#adminPanel { position: fixed; inset: 0; background: var(--bg); z-index: 3000; display: none; flex-direction: column; padding-top: 75px; overflow-y: auto; }
.admin-header { padding: 15px; background: var(--surface); border-bottom: 1px solid var(--accent); display: flex; justify-content: space-between; align-items: center; box-shadow: 0 5px 20px var(--accent-glow); }
.admin-close { background: var(--accent); border: none; color: #fff; padding: 8px 16px; font-size: 10px; font-weight: bold; border-radius: 4px; }
.chart-container { background: var(--surface); padding: 15px; border-radius: 8px; margin: 15px; border: 1px solid rgba(255,255,255,0.05); }
.gen-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 0 15px 20px 15px; }
.gen-btn { padding: 14px; background: var(--bg); border: 1px solid var(--accent); color: var(--text); font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.2s; }
.gen-btn:hover { background: var(--accent); color: #fff; box-shadow: 0 0 15px var(--accent-glow); }

@keyframes slideUp { from { transform: translateY(50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
@keyframes pulseGlowSuccess { 0%, 100% { text-shadow: 0 0 5px rgba(0,255,102,0.5); } 50% { text-shadow: 0 0 15px rgba(0,255,102,1); } }
</style>
</head>
<body>

<div class="grid-bg"></div>

<header>
  <div class="header-left">
    <h1>TRACEUR<span>_PRO</span></h1>
  </div>
  <div class="header-right">
    <div class="status-badge" id="headerStatus">ACTIF</div>
    <div class="profile-btn" id="profileBtn" onclick="toggleDropdown(event)"></div>
    
    <div class="profile-dropdown" id="profileDropdown" onclick="event.stopPropagation()">
      <div>
        <div class="dropdown-user-title">Accès Serveur</div>
        <div class="dropdown-timer-text" id="dropdownTimer">TERM: --h --m --s</div>
      </div>
      <button class="admin-link-btn" id="adminBtn" onclick="openAdmin()">SÉCURITÉ & LOGS</button>
      <div class="theme-options">
        <button class="theme-opt-btn active" id="th-cyber" onclick="setTheme('cyber')">Cyber</button>
        <button class="theme-opt-btn" id="th-furtif" onclick="setTheme('furtif')">Furtif</button>
        <button class="theme-opt-btn" id="th-ocean" onclick="setTheme('ocean')">Océan</button>
      </div>
    </div>
  </div>
</header>

<div class="main-wrapper">
  <div id="lockScreen" style="display:none; position: fixed; inset: 0; background: var(--bg); z-index: 900; align-items: center; justify-content: center; flex-direction: column; padding: 20px;">
    <div style="width: 100%; max-width: 350px; background: var(--surface); padding: 30px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.8);">
      <h2 style="font-family: var(--font-display); color: var(--accent); margin-bottom: 25px; text-shadow: 0 0 15px var(--accent-glow); letter-spacing: 2px;">IDENTIFICATION</h2>
      <input id="keyInput" style="width: 100%; background: var(--bg); border: 1px solid var(--accent); padding: 16px; color: #fff; font-family: var(--font-mono); font-size: 16px; text-align: center; letter-spacing: 2px; outline: none; margin-bottom: 20px; border-radius: 6px; box-shadow: inset 0 0 10px rgba(255,30,86,0.1);" maxlength="14" placeholder="XXXX-XXXX-XXXX" autocomplete="off">
      <button onclick="submitKey()" style="width: 100%; padding: 16px; background: var(--accent); border: none; color: #fff; font-family: var(--font-display); font-weight: 900; letter-spacing: 1px; cursor: pointer; border-radius: 6px; box-shadow: 0 5px 20px var(--accent-glow);">DÉVERROUILLER</button>
      <div id="lockError" style="color: var(--accent); font-size: 11px; margin-top: 15px; font-weight: bold; display: none;"></div>
    </div>
  </div>

  <div id="mainUI" style="display:none">
    <div class="status-bar">
      <span><span class="dot" style="display:inline-block;width:6px;height:6px;background:var(--success);border-radius:50%;box-shadow:0 0 8px var(--success);margin-right:6px;"></span>EN LIGNE</span>
      <span id="statusTime">SYS: --:--:--</span>
    </div>
    <main>
      <div class="section-title">PARAMÈTRES DE CIBLAGE</div>
      <div class="tabs" id="tabs"></div>
      
      <div class="criteria-bar" id="criteriaBar">
        <h3 style="font-size: 9px; color: var(--muted); margin-bottom: 8px;">DONNÉES COMPILÉES</h3>
        <div id="criteriaList" style="display:flex; flex-wrap:wrap;"></div>
      </div>

      <div class="fields-grid" id="fieldsGrid"></div>

      <button class="search-btn" id="searchBtn" disabled onclick="launchSearch()">INITIALISER LA TRAQUE</button>
      <button class="clear-btn" id="clearBtn" style="display:none" onclick="clearAll()">Purger les données</button>

      <div id="resultsSection" style="display:none; margin-top:30px;"></div>
    </main>
  </div>
</div>

<div class="deep-modal" id="deepModal">
  <div class="deep-box">
    <button class="deep-close" onclick="document.getElementById('deepModal').classList.remove('open')">×</button>
    <div class="deep-title">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
      ANALYSE DES LIENS
    </div>
    <div id="deepLoader" style="color:var(--accent); font-size:11px; text-align:center; padding:20px; display:none;">SCAN DANS LES REGISTRES...</div>
    <div id="deepResults"></div>
  </div>
</div>

<div class="overlay" id="overlay" onclick="closeSheet(event)">
  <div class="input-sheet" id="inputSheet" onclick="event.stopPropagation()">
    <h3 style="font-size:12px; margin-bottom:15px; color:var(--text); text-transform:uppercase;">INJECTER > <span id="sheetLabel" style="color:var(--accent)"></span></h3>
    <input class="input-field" id="sheetInput" autocomplete="off"/>
    <div style="display:flex; gap:10px;">
      <button class="btn-cancel" onclick="closeSheet(null, true)">Annuler</button>
      <button class="btn-confirm" onclick="confirmValue()">Enregistrer</button>
    </div>
  </div>
</div>

<div id="adminPanel">
  <div class="admin-header">
    <h2 style="font-family:var(--font-display); font-size:14px;">CENTRE DE CONTRÔLE</h2>
    <button class="admin-close" onclick="document.getElementById('adminPanel').style.display='none'">RETOUR</button>
  </div>
  <div class="chart-container">
    <div style="font-size:10px; color:var(--muted); margin-bottom:10px; font-weight:bold;">REQUÊTES VERS BRIXHUB (MAX 1000/J)</div>
    <canvas id="apiChart" height="150"></canvas>
  </div>
  <div style="padding: 0 15px; font-size: 10px; color: var(--muted); margin-bottom: 10px; font-weight: bold;">GÉNÉRATION CLÉS SECRÈTES</div>
  <div class="gen-grid">
    <button class="gen-btn" onclick="adminGenKey('3min')">3 MINUTES (DEV)</button>
    <button class="gen-btn" onclick="adminGenKey('1week')">1 SEMAINE</button>
    <button class="gen-btn" onclick="adminGenKey('1month')">1 MOIS</button>
    <button class="gen-btn" onclick="adminGenKey('3months')">3 MOIS</button>
  </div>
  <div id="generatedKeysDisplay" style="margin: 0 15px 20px 15px; color:var(--success); font-family:var(--font-mono); font-size:14px; font-weight:bold; word-break:break-all;"></div>
</div>

<script>
const BASE = "https://backend-traceur.onrender.com"; 

window.Telegram?.WebApp?.ready();
window.Telegram?.WebApp?.expand();

const tgUser = window.Telegram?.WebApp?.initDataUnsafe?.user;
const TELEGRAM_ID = tgUser?.id ? String(tgUser.id) : "TEST_LOCAL_USER";

// === TON ID ADMIN ICI ===
const ADMIN_ID = "TON_ID_TELEGRAM_ICI"; 

let activeCat = "identite";
let criteria = {};
let currentField = null;
let currentResults = []; // Stockage global pour l'algorithme familial
let sessionEndTimestamp = null;
let timerInterval = null;

// Initialisation Visuelle
const profileBtn = document.getElementById('profileBtn');
if (tgUser?.photo_url) profileBtn.innerHTML = `<img src="${tgUser.photo_url}" />`;
else profileBtn.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`;

if (TELEGRAM_ID === ADMIN_ID) document.getElementById('adminBtn').style.display = 'block';

setInterval(() => document.getElementById("statusTime").textContent = "SYS: " + new Date().toTimeString().slice(0,8), 1000);

document.getElementById("keyInput").addEventListener("input", (e) => {
  let val = e.target.value.replace(/[^a-zA-Z0-9]/g, '').toUpperCase();
  if (val.length > 4 && val.length <= 8) val = val.slice(0, 4) + '-' + val.slice(4);
  else if (val.length > 8) val = val.slice(0, 4) + '-' + val.slice(4, 8) + '-' + val.slice(8, 12);
  e.target.value = val;
});

document.addEventListener("DOMContentLoaded", async () => {
  buildTabs(); renderFields();
  await checkSession(null);
});

function toggleDropdown(e) { e.stopPropagation(); document.getElementById("profileDropdown").classList.toggle("open"); }
document.addEventListener("click", () => document.getElementById("profileDropdown").classList.remove("open"));

function setTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  if(t==='cyber') document.documentElement.removeAttribute('data-theme');
  document.querySelectorAll('.theme-opt-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('th-'+t).classList.add('active');
}

// === SYSTEME D'AUTHENTIFICATION ===
async function checkSession(code) {
  try {
    const res = await fetch(`${BASE}/api/auth`, {
      method: "POST", headers: { "Content-Type": "application/json", "x-telegram-id": TELEGRAM_ID },
      body: JSON.stringify({ code })
    });
    const data = await res.json();
    if (data.valid) {
      document.getElementById("lockScreen").style.display = "none";
      document.getElementById("mainUI").style.display = "block";
      document.getElementById("headerStatus").classList.add("active");
      sessionEndTimestamp = data.expiresAt;
      startCountdown();
    } else {
      document.getElementById("lockScreen").style.display = "flex";
      document.getElementById("mainUI").style.display = "none";
      document.getElementById("headerStatus").classList.remove("active");
      if (code) {
        document.getElementById("lockError").textContent = data.error;
        document.getElementById("lockError").style.display = "block";
      }
    }
  } catch(e) { document.getElementById("lockScreen").style.display = "flex"; }
}
async function submitKey() { await checkSession(document.getElementById("keyInput").value.trim()); }

function startCountdown() {
  if (timerInterval) clearInterval(timerInterval);
  function update() {
    if (sessionEndTimestamp === 'lifetime') return document.getElementById("dropdownTimer").textContent = "ILLIMITÉ";
    const remaining = sessionEndTimestamp - Date.now();
    if (remaining <= 0) {
      clearInterval(timerInterval);
      document.getElementById("lockScreen").style.display = "flex";
      document.getElementById("mainUI").style.display = "none";
      document.getElementById("headerStatus").classList.remove("active");
      return;
    }
    const d = Math.floor(remaining / 86400000);
    const h = Math.floor((remaining / 3600000) % 24);
    const m = Math.floor((remaining / 60000) % 60);
    document.getElementById("dropdownTimer").textContent = `${d}j ${String(h).padStart(2,'0')}h ${String(m).padStart(2,'0')}m`;
  }
  update(); timerInterval = setInterval(update, 60000);
}

// === MOTEUR UI ===
const CATEGORIES = [
  { id:"identite", label:"Identité", fields:[ {k:"nom_famille", l:"Nom"}, {k:"prenom", l:"Prénom"}, {k:"date_naissance", l:"Date Nais (JJ/MM/AAAA)"}, {k:"annee_naissance", l:"Année Nais."} ]},
  { id:"contact", label:"Contact", fields:[ {k:"telephone", l:"Téléphone"}, {k:"email", l:"Email"} ]},
  { id:"localisation", label:"Localisation", fields:[ {k:"ville", l:"Ville"}, {k:"code_postal", l:"Code Postal"}, {k:"adresse", l:"Rue/Adresse"} ]},
  { id:"vehicule", label:"Véhicule", fields:[ {k:"immatriculation", l:"Plaque"}, {k:"vin_plaque", l:"VIN"} ]}
];
const FIELD_MAP = {}; CATEGORIES.forEach(c => c.fields.forEach(f => FIELD_MAP[f.k] = f));

function buildTabs() { document.getElementById("tabs").innerHTML = CATEGORIES.map(c => `<button class="tab ${c.id===activeCat?'active':''}" onclick="activeCat='${c.id}';buildTabs();renderFields()">${c.label}</button>`).join(""); }
function renderFields() {
  document.getElementById("fieldsGrid").innerHTML = CATEGORIES.find(c=>c.id===activeCat).fields.map(f => {
    const filled = criteria[f.k] !== undefined;
    return `<button class="field-btn ${filled?'filled':''}" onclick="openSheet('${f.k}')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="field-icon"><circle cx="12" cy="12" r="3"/></svg><span>${f.l}</span>${filled?'<span class="tick"></span>':''}</button>`;
  }).join("");
}

function openSheet(k) { currentField = k; document.getElementById("sheetLabel").textContent = FIELD_MAP[k].l; document.getElementById("sheetInput").value = criteria[k]||""; document.getElementById("overlay").classList.add("open"); setTimeout(()=>document.getElementById("sheetInput").focus(), 100); }
function closeSheet(e, force=false) { if(force || e.target.id==="overlay") document.getElementById("overlay").classList.remove("open"); }
function confirmValue() { const v = document.getElementById("sheetInput").value.trim(); if(v) criteria[currentField]=v; else delete criteria[currentField]; closeSheet(null,true); updateUI(); }

function updateUI() {
  renderFields();
  const keys = Object.keys(criteria);
  document.getElementById("criteriaBar").style.display = keys.length ? "block" : "none";
  document.getElementById("criteriaList").innerHTML = keys.map(k => `<div class="criteria-tag"><span class="key">${FIELD_MAP[k].l}:</span> ${criteria[k]} <span class="remove" onclick="delete criteria['${k}'];updateUI()">×</span></div>`).join("");
  document.getElementById("searchBtn").disabled = keys.length === 0;
  document.getElementById("clearBtn").style.display = keys.length ? "block" : "none";
}
function clearAll() { criteria = {}; document.getElementById("resultsSection").style.display="none"; updateUI(); }

// === RECHERCHE PRINCIPALE ===
async function launchSearch() {
  const rs = document.getElementById("resultsSection");
  rs.style.display = "block";
  rs.innerHTML = `<div style="text-align:center;color:var(--accent);font-size:12px;padding:30px;font-weight:bold;animation:pulseGlowSuccess 1s infinite;">ACQUISITION DES DONNÉES...</div>`;
  rs.scrollIntoView({behavior:"smooth"});

  try {
    const r = await fetch(`${BASE}/api/search`, { method:"POST", headers:{"Content-Type":"application/json","x-telegram-id":TELEGRAM_ID}, body:JSON.stringify(criteria) });
    if(r.status===429) return rs.innerHTML = `<div style="color:var(--accent);text-align:center;padding:20px;">BLOCAGE: LIMITE API ATTEINTE</div>`;
    if(r.status===403) return checkSession(null);
    
    const data = await r.json();
    currentResults = data?.data?.results || [];
    if(!currentResults.length) return rs.innerHTML = `<div style="text-align:center;font-size:11px;color:var(--muted);padding:20px;">AUCUNE CORRESPONDANCE TROUVÉE</div>`;
    
    rs.innerHTML = currentResults.map((p, index) => {
      const skip = new Set(["_sources","_confidence","_id"]);
      const rows = Object.entries(p).filter(([k,v]) => !skip.has(k) && v).map(([k,v]) => `<div class="info-row"><span class="info-key">${(FIELD_MAP[k]?.l || k).replace(/_/g," ")}</span><span class="info-val">${v}</span></div>`).join("");
      const fullName = `${p.prenom||''} ${p.nom_famille||'DOSSIER INCONNU'}`.toUpperCase();
      
      // Bouton Approfondir affiché seulement si on a un nom de famille et une info de loc
      let deepenHtml = '';
      if(p.nom_famille && (p.code_postal || p.ville || p.adresse)) {
          deepenHtml = `<button class="deepen-btn" onclick="openDeepSearch(${index})">APPROFONDIR LA RECHERCHE (LIENS FAMILIAUX)</button>`;
      }

      return `<div class="result-card"><div class="card-header"><span class="card-name">${fullName}</span></div><div class="card-body">${rows}</div>${deepenHtml}</div>`;
    }).join("");
  } catch(e) { document.getElementById("resultsSection").innerHTML = `<div style="text-align:center;color:var(--accent);padding:20px;">ERREUR DE CONNEXION AU SERVEUR</div>`; }
}

// === ALGORITHME DE RECHERCHE FAMILIALE ===
function extractYear(dateStr, yearStr) {
    if (yearStr) return parseInt(yearStr);
    if (dateStr) {
        const m = dateStr.match(/\d{4}/);
        if (m) return parseInt(m[0]);
    }
    return null;
}

async function openDeepSearch(index) {
    const target = currentResults[index];
    const modal = document.getElementById("deepModal");
    const resDiv = document.getElementById("deepResults");
    const loader = document.getElementById("deepLoader");
    
    modal.classList.add("open");
    resDiv.innerHTML = "";
    loader.style.display = "block";

    // Préparation de la requête ciblée
    const deepCriteria = { nom_famille: target.nom_famille };
    if (target.code_postal) deepCriteria.code_postal = target.code_postal;
    else if (target.ville) deepCriteria.ville = target.ville;
    else if (target.adresse) deepCriteria.adresse = target.adresse;

    try {
        const r = await fetch(`${BASE}/api/search`, { method:"POST", headers:{"Content-Type":"application/json","x-telegram-id":TELEGRAM_ID}, body:JSON.stringify(deepCriteria) });
        const data = await r.json();
        const relatives = data?.data?.results || [];
        loader.style.display = "none";

        const targetYear = extractYear(target.date_naissance, target.annee_naissance);
        let found = 0;

        const html = relatives.map(rel => {
            // Exclure la cible elle-même (approximation via prénom)
            if (rel.prenom?.toLowerCase() === target.prenom?.toLowerCase()) return "";
            
            let relLabel = "Lien possible";
            const relYear = extractYear(rel.date_naissance, rel.annee_naissance);
            
            if (targetYear && relYear) {
                const diff = Math.abs(targetYear - relYear);
                if (diff < 15) relLabel = "Frère / Sœur possible";
                else if (diff >= 16 && diff <= 50) {
                    relLabel = targetYear > relYear ? "Père / Mère possible" : "Enfant possible";
                }
            }
            
            found++;
            return `<div class="rel-card" onclick="alert('Pour enquêter sur cette personne, lancez une nouvelle recherche principale avec son nom et prénom.')">
                      <span class="rel-tag">${relLabel}</span>
                      <div class="rel-name">${rel.prenom || ''} ${rel.nom_famille || ''}</div>
                      <div style="font-size:9px; color:var(--muted); margin-top:4px;">${rel.date_naissance || rel.annee_naissance || 'Âge inconnu'} • ${rel.ville || ''}</div>
                    </div>`;
        }).join("");

        if(found === 0) resDiv.innerHTML = `<div style="text-align:center; color:var(--muted); font-size:11px;">AUCUN LIEN FAMILIAL DÉTECTÉ DANS CE SECTEUR</div>`;
        else resDiv.innerHTML = html;

    } catch(e) {
        loader.style.display = "none";
        resDiv.innerHTML = `<div style="color:var(--accent); text-align:center;">ÉCHEC DE L'ANALYSE</div>`;
    }
}

// === DASHBOARD ADMIN ===
let chartInstance = null;
async function openAdmin() {
  document.getElementById("profileDropdown").classList.remove("open");
  document.getElementById("adminPanel").style.display = "flex";
  
  const res = await fetch(`${BASE}/api/admin/dashboard`, { headers:{"x-telegram-id": TELEGRAM_ID} });
  const data = await res.json();
  
  const ctx = document.getElementById('apiChart').getContext('2d');
  const labels = Object.keys(data.stats).slice(-7);
  const values = Object.values(data.stats).slice(-7);
  if(chartInstance) chartInstance.destroy();
  chartInstance = new Chart(ctx, {
    type: 'line',
    data: { labels, datasets: [{ label: 'Requêtes API', data: values, borderColor: '#ff1e56', backgroundColor: 'rgba(255, 30, 86, 0.2)', borderWidth: 2, fill: true, tension: 0.4 }] },
    options: { scales: { y: { beginAtZero: true, max: 1000 } }, plugins: { legend: { display: false } } }
  });
}

async function adminGenKey(type) {
  const res = await fetch(`${BASE}/api/admin/generate`, { method:"POST", headers:{"Content-Type":"application/json","x-telegram-id":TELEGRAM_ID}, body:JSON.stringify({type}) });
  const data = await res.json();
  if(data.success) document.getElementById("generatedKeysDisplay").innerHTML = `CLÉ (${data.label}): <br/><span style="color:#fff; font-size:18px;">${data.key}</span>`;
}
